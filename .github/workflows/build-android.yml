# Builds the Android tablet app on GitHub's machines instead of on Expo's build servers, so it
# does not use Expo's monthly build quota and does not wait in Expo's queue.
# The signing key still comes from the Expo project (organization pakogsend, project pak-and-send),
# read with the EXPO_TOKEN secret, so the tablets accept the result as an update.
#
# Start it by hand: GitHub → Actions → "Build Android app" → Run workflow, or
#   gh workflow run build-android.yml -f publish=true -f notes="What changed"
# How it fits into a release: docs/DEVELOPMENT.md, "How a change goes live".
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the app as a new version on the download page
        type: boolean
        default: false
      notes:
        description: What changed (shown with the version)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: mobile
    env:
      APK: ${{ github.workspace }}/pak-and-send-native.apk
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read the version from app.json
        id: version
        run: |
          version="$(node -p "require('./app.json').expo.version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "App version: $version"

      - name: Stop early when this version is already published
        if: ${{ inputs.publish }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "mobile-v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Version $VERSION is already published. Raise expo.version in mobile/app.json first."
            exit 1
          fi

      - name: Install the app's packages
        run: npm ci

      - name: Check that the Expo token is there
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN secret is missing (repo → Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Build the APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@27.7.2 build --platform android --profile preview --local --non-interactive --output "$APK"

      # A kiosk tablet only installs an update that is signed with the same key as the app it has,
      # and whose build number is not lower. Both are checked against the newest published version.
      - name: Check the signature and the version against the newest published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          signer() { "${tools}apksigner" verify --print-certs "$1" | grep -m1 'certificate SHA-256 digest' | sed 's/.*: //'; }
          badge() { "${tools}aapt2" dump badging "$1" | head -n 1; }
          field() { echo "$1" | sed -n "s/.*$2='\([^']*\)'.*/\1/p"; }

          new="$(badge "$APK")"
          echo "Built: package $(field "$new" name), version $(field "$new" versionName), build number $(field "$new" versionCode)"
          if [ "$(field "$new" versionName)" != "$VERSION" ]; then
            echo "::error::The APK says version $(field "$new" versionName), app.json says $VERSION."
            exit 1
          fi

          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName -q '[.[] | select(.tagName | startswith("mobile-v"))][0].tagName')"
          if [ -z "$previous_tag" ]; then
            echo "No earlier version is published, so there is nothing to compare with."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern pak-and-send-native.apk --dir "$RUNNER_TEMP/previous"
          old_apk="$RUNNER_TEMP/previous/pak-and-send-native.apk"
          old="$(badge "$old_apk")"
          echo "Newest published ($previous_tag): version $(field "$old" versionName), build number $(field "$old" versionCode)"

          if [ "$(signer "$APK")" != "$(signer "$old_apk")" ]; then
            echo "::error::This APK is signed with another key than $previous_tag. The tablets would refuse it."
            exit 1
          fi
          echo "Signature: the same key as $previous_tag."
          if [ "$(field "$new" versionCode)" -lt "$(field "$old" versionCode)" ]; then
            echo "::error::The build number is lower than in $previous_tag. The tablets would refuse it."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pak-and-send-native
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish on the download page
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pak-and-send-native

      - name: Publish the version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "mobile-v$VERSION" pak-and-send-native.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pak & Send — Native Android App v$VERSION" \
            --notes "${NOTES:-Version $VERSION}"
